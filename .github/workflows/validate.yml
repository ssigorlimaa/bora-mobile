name: Validate BORA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
      - run: npx expo export --platform android
